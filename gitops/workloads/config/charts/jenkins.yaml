apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: jenkins
  namespace: argocd
spec:
  # Required: the template below uses Go-template syntax ({{ .name }},
  # {{ .metadata.annotations.* }}). Without this, Argo CD falls back to legacy
  # fasttemplate, which only understands {{name}}/{{server}} and cannot
  # traverse annotations - every Application fails destination validation.
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusters:
        selector:
          matchLabels:
            workload_cluster: "true"
  template:
    metadata:
      name: '{{ .name }}-jenkins'
    spec:
      project: default
      sources:
        - repoURL: https://charts.jenkins.io
          chart: jenkins
          targetRevision: "5.9.42"
          helm:
            # Pin the release name so rendered object names stay deterministic.
            releaseName: jenkins
            values: |
              controller:
                serviceType: ClusterIP
                jenkinsUrlProtocol: http
                # Serve the war under /jenkins so one shared ALB can host many
                # workloads by path. Jenkins generates prefixed links and the
                # chart prefixes its own probes, so the ALB needs no rewrite.
                jenkinsUriPrefix: /jenkins
                # controller.jenkinsUrl is deliberately unset: the ALB hostname
                # is assigned by AWS and is not knowable at render time. JCasC
                # falls back to http://jenkins:8080/jenkins, which is the
                # correct URL for the agent JNLP handshake because agents run
                # in-cluster. The cost is a cosmetic "Jenkins URL is not set"
                # admin monitor.
                resources:
                  requests:
                    cpu: "1000m"
                    memory: "2Gi"
                  limits:
                    cpu: "2000m"
                    memory: "4Gi"
                podSecurityContextOverride:
                  runAsUser: 1000
                  runAsGroup: 1000
                  fsGroup: 1000
                  runAsNonRoot: true
                ingress:
                  enabled: true
                  ingressClassName: alb
                  # No hostName: a host-less rule matches any Host header, so
                  # the ALB answers on its own AWS-assigned DNS name.
                  path: /jenkins
                  annotations:
                    # --- Group-level. Every member of platform-public must
                    # carry these four byte-identical or the controller refuses
                    # to reconcile the group. See
                    # docs/operations/public-workload-access.md.
                    alb.ingress.kubernetes.io/group.name: platform-public
                    alb.ingress.kubernetes.io/scheme: internet-facing
                    alb.ingress.kubernetes.io/load-balancer-name: aws-eks-infra-public
                    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
                    # --- Per workload.
                    # target-type ip is the only mode EKS Fargate supports.
                    alb.ingress.kubernetes.io/target-type: ip
                    alb.ingress.kubernetes.io/group.order: '10'
                    alb.ingress.kubernetes.io/healthcheck-path: /jenkins/login
              # persistence is a TOP-LEVEL chart key, not controller.persistence.
              # Nested under controller it is silently ignored, and the chart
              # falls back to its default (existingClaim null, storageClass
              # null), creating its own unbindable PVC named "jenkins".
              persistence:
                enabled: true
                existingClaim: jenkins-home
              agent:
                enabled: true
                namespace: apps-jenkins
                resources:
                  requests:
                    cpu: "500m"
                    memory: "512Mi"
                  limits:
                    cpu: "1000m"
                    memory: "1Gi"
              rbac:
                create: true
              serviceAccount:
                create: true
                name: jenkins
              serviceAccountAgent:
                create: true
                name: jenkins-agent
        - repoURL: '{{ .metadata.annotations.gitops_repo_url }}'
          targetRevision: '{{ .metadata.annotations.gitops_revision }}'
          path: gitops/workloads/charts/jenkins-storage
          helm:
            releaseName: jenkins-storage
            values: |
              fileSystemId: '{{ .metadata.annotations.efs_file_system_id }}'
              accessPointId: '{{ .metadata.annotations.jenkins_efs_access_point_id }}'
              namespace: apps-jenkins
      destination:
        server: '{{ .server }}'
        namespace: apps-jenkins
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
