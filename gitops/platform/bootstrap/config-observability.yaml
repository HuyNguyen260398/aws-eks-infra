apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-observability
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            platform_cluster: "true"
  template:
    metadata:
      name: '{{ .name }}-platform-observability'
    spec:
      project: default
      source:
        repoURL: '{{ .metadata.annotations.gitops_repo_url }}'
        targetRevision: '{{ .metadata.annotations.gitops_revision }}'
        path: gitops/platform/config/observability
        directory:
          recurse: true
      destination:
        server: '{{ .server }}'
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          allowEmpty: true
        syncOptions:
          - ServerSideApply=true
