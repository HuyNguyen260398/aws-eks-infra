apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-observability
  namespace: argocd
spec:
  # Required: the template below uses Go-template syntax ({{ .name }},
  # {{ .metadata.annotations.* }}). Without this, Argo CD falls back to legacy
  # fasttemplate, which only understands {{name}}/{{server}} and cannot
  # traverse annotations - every Application fails destination validation.
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusters:
        selector:
          matchLabels:
            platform_cluster: "true"
  template:
    metadata:
      name: '{{ .name }}-platform-observability'
    spec:
      project: default
      source:
        repoURL: '{{ .metadata.annotations.gitops_repo_url }}'
        targetRevision: '{{ .metadata.annotations.gitops_revision }}'
        path: gitops/platform/config/observability
        kustomize:
          patches:
            - target:
                kind: ConfigMap
                name: aws-logging
                namespace: aws-observability
              patch: |
                - op: replace
                  path: /data/output.conf
                  value: |
                    [OUTPUT]
                        Name cloudwatch_logs
                        Match   *
                        region {{ .metadata.annotations.aws_region }}
                        log_group_name {{ .metadata.annotations.fargate_log_group_name }}
                        log_stream_prefix {{ .metadata.labels.cluster_name }}-
                        auto_create_group false
            - target:
                kind: ServiceAccount
                name: adot-collector
                namespace: amazon-cloudwatch
              patch: |
                - op: add
                  path: /metadata/annotations
                  value:
                    eks.amazonaws.com/role-arn: '{{ .metadata.annotations.adot_role_arn }}'
      destination:
        server: '{{ .server }}'
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          allowEmpty: true
        syncOptions:
          - ServerSideApply=true
